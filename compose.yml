name: mta
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mta
      MYSQL_USER: mta
      MYSQL_PASSWORD: mta_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D mta -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: ["kafka_data:/tmp/kraft-combined-logs"]
  api:
    build: ./backend
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mta?connectionTimeZone=UTC
      DB_USER: mta
      DB_PASSWORD: mta_dev_only
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
volumes:
  mysql_data:
  redis_data:
  kafka_data:
