# Site phục vụ React và chuyển tiếp API trong network Docker Compose.
server {
    # Nginx nghe HTTP trên cổng 80 trong container; Compose ánh xạ host port 5173.
    listen 80;

    # Thư mục chứa bundle React được COPY từ giai đoạn build của Dockerfile.
    root /usr/share/nginx/html;

    # Chuyển yêu cầu /api/... sang Spring Boot bằng tên dịch vụ api.
    # proxy_pass không có URI phía sau cổng nên giữ nguyên đường dẫn /api/....
    location /api/ {
        proxy_pass http://api:8080;
        # Chuyển tiếp tên host của yêu cầu tới backend.
        proxy_set_header Host $host;
    }

    # Ưu tiên file tĩnh tồn tại; nếu không có thì trả index.html cho điều hướng SPA.
    location / {
        try_files $uri /index.html;
    }
}
